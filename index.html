<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو التحريك وتصوير الفيديو - Animation Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>استوديو تحريك الشخصيات وتصدير الفيديو</h1>
    <div class="status-bar">
      <span id="recBadge" class="badge badge-rec" style="display: none;">🔴 جاري التسجيل...</span>
      <span class="badge">النسخة التفاعلية 2.0</span>
    </div>
  </header>

  <div class="main-container">
    
    <!-- Sidebar Controls -->
    <div class="controls-panel">
      
      <!-- Section 1: Character Customization -->
      <div class="panel-section">
        <h3>🎨 تخصيص أجزاء الشخصية</h3>
        
        <div class="control-group">
          <label>شكل الرأس:</label>
          <select id="headShape">
            <option value="circle">دائري كلاسيكي</option>
            <option value="square">مربع منحني</option>
            <option value="cat">أذنان لطيفان</option>
            <option value="robot">روبوت مستقبل</option>
          </select>
        </div>

        <div class="control-group">
          <label>تعبير العيون:</label>
          <select id="eyeStyle">
            <option value="happy">سعيد (^ ^)</option>
            <option value="normal">عادي (• •)</option>
            <option value="surprised">متفاجئ (⊙ ⊙)</option>
            <option value="blink">مغمض (- -)</option>
          </select>
        </div>

        <div class="control-group">
          <label>نمط الذراع والجذع:</label>
          <select id="armStyle">
            <option value="smooth">أنبوبي ناعم</option>
            <option value="segmented">مفاصل مستقبلي</option>
            <option value="stick">ستيك مان رفيع</option>
          </select>
        </div>

        <div class="control-group dual">
          <div>
            <label>لون الشخصية:</label>
            <input type="color" id="primaryColor" value="#38bdf8">
          </div>
          <div>
            <label>لون المفصل:</label>
            <input type="color" id="jointColor" value="#22c55e">
          </div>
        </div>
      </div>

      <!-- Section 2: Physics -->
      <div class="panel-section">
        <h3>⚡ فيزياء الحركة</h3>
        <div class="control-group">
          <label>انحناء الجذع مع الذراع: <span id="torsoVal">25%</span></label>
          <input type="range" id="torsoWeight" min="0" max="0.6" step="0.05" value="0.25">
        </div>
        <div class="control-group">
          <label>مرونة الحركة: <span id="springVal">12</span></label>
          <input type="range" id="springStiffness" min="5" max="25" step="1" value="12">
        </div>
      </div>

      <!-- Section 3: Video Recording for YouTube -->
      <div class="panel-section">
        <h3>🎥 تصوير الفيديو لليوتيوب</h3>
        <div class="btn-group">
          <button class="btn btn-record" id="startRecBtn">⏺️ بدء تسجيل الفيديو</button>
          <button class="btn btn-stop" id="stopRecBtn" disabled>⏹️ إيقاف وتحميل الفيديو</button>
        </div>
      </div>

      <!-- Section 4: Timeline Controls -->
      <div class="panel-section">
        <button class="btn" id="addFrameBtn">➕ إضافة مشهد للمصغرات</button>
        <button class="btn btn-secondary" id="playSeqBtn">▶️ تشغيل العرض التتابعي</button>
        <button class="btn btn-danger" id="resetBtn">🔄 إعادة ضبط</button>
      </div>

    </div>

    <!-- Canvas Area -->
    <div class="viewport">
      <div class="hint">حرك المقبض الأخضر بالسحب | التعديلات على الشخصية تظهر فوراً</div>
      <canvas id="mainCanvas"></canvas>
    </div>

  </div>

  <!-- Bottom Timeline (Thumbnails Strip) -->
  <div class="timeline-container">
    <div class="timeline-header">
      <span>شريط المشاهد المصغرة (Storyboard Keyframes)</span>
      <span id="frameCount">عدد المشاهد: 0</span>
    </div>
    <div class="thumbnails-strip" id="thumbStrip"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك الشخصيات الكرتونية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>🎨 محرك الشخصيات الكرتونية</h1>
            <p>اختر شخصيتك وحرك العظام كما تريد</p>
        </header>

        <main>
            <aside class="characters-panel">
                <h2>👤 اختر الشخصية</h2>
                <div class="character-list">
                    <button class="char-btn active" data-char="human">
                        <span class="char-icon">🧍</span>
                        <span>الإنسان</span>
                    </button>
                    <button class="char-btn" data-char="robot">
                        <span class="char-icon">🤖</span>
                        <span>الروبوت</span>
                    </button>
                    <button class="char-btn" data-char="cat">
                        <span class="char-icon">🐱</span>
                        <span>القط</span>
                    </button>
                </div>
            </aside>

            <section class="stage">
                <div class="canvas-container">
                    <svg id="stage-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                        <!-- الشخصية ستُحقن هنا بالJavaScript -->
                    </svg>
                </div>
            </section>

            <aside class="bones-panel">
                <h2>🦴 لوحة التحكم</h2>
                <div id="bones-controls">
                    <!-- عناصر التحكم ستُولد ديناميكياً -->
                </div>
                <div class="actions">
                    <button id="reset-pose">↺ إعادة الوضعية</button>
                    <button id="random-pose">🎲 وضعية عشوائية</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

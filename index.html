<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova 2D Animation Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="toolbar">
        <div class="logo">✨ NOVA STUDIO</div>
        <div class="controls-group">
            <label>الشخصية:</label>
            <select id="charSelect" onchange="changeCharacter(this.value)">
                <option value="nova">نوفا (Nova)</option>
                <option value="cyber">سايبر بوي (Cyber)</option>
            </select>
            
            <label>التعبير:</label>
            <select id="exprSelect" onchange="changeExpression(this.value)">
                <option value="normal">عادي</option>
                <option value="happy">سعيد 🤩</option>
                <option value="angry">غاضب 😠</option>
                <option value="shocked">منصدم 😲</option>
            </select>
        </div>
        <div class="export-group">
            <button onclick="saveProject()">💾 تصدير المشروع (JSON)</button>
            <button onclick="loadProjectPrompt()">📂 استيراد مشروع</button>
        </div>
    </header>

    <main class="workspace">
        <canvas id="animCanvas" width="800" height="550"></canvas>
    </main>

    <footer class="timeline-panel">
        <div class="timeline-controls">
            <button onclick="saveKeyframe()">📸 إضافة مشهد (Keyframe)</button>
            <button onclick="playAnimation()">▶️ تشغيل الأنيميشن</button>
            <button onclick="clearKeyframes()">🗑️ مسح المشاهد</button>
            <span id="frameCounter">المشاهد المحفوظة: 0</span>
        </div>
        <div class="timeline-track" id="timelineTrack">
            <!-- شريط الفريمات المرئي -->
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
